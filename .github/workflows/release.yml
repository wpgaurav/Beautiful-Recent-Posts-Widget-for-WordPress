name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

# Manual runs are dry runs. Branch pushes and prereleases never deploy to SVN.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0
      - name: Validate versions and release state
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$EVENT_NAME" == release ]]; then
            python3 scripts/release.py metadata --tag "$RELEASE_TAG" --event "$GITHUB_EVENT_PATH"
          else
            python3 scripts/release.py metadata
          fi
      - name: Stable release must be on the default branch
        if: github.event_name == 'release' && steps.metadata.outputs.prerelease == 'false'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"

  quality:
    name: Release quality gates
    needs: validate
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}

  build:
    name: Build one verified distribution
    needs: [validate, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - name: Build ZIP, checksum, changelog and directory artwork
        run: |
          python3 scripts/release.py build
          python3 scripts/release.py verify
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Describe the run
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          {
            echo "## Beautiful Recent Posts $VERSION"
            if [[ "$EVENT_NAME" != release ]]; then
              echo 'Dry run: quality checks and packaging only. No GitHub Release or WordPress.org changes.'
            elif [[ "$PRERELEASE" == true ]]; then
              echo 'Prerelease: GitHub assets only. WordPress.org deployment is skipped.'
            else
              echo 'Stable release: the same verified ZIP contents will be used for GitHub and WordPress.org.'
            fi
            cat dist/*.sha256
            cat dist/release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: Attach GitHub Release assets
    if: github.event_name == 'release' && !github.event.release.draft
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist/
      - name: Revalidate the artifact and published release before uploading
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          python3 scripts/release.py verify
          python3 scripts/release.py publish --sha "$RELEASE_SHA"

  wordpress-org:
    name: Deploy stable release to WordPress.org
    if: >-
      github.event_name == 'release' &&
      !github.event.release.draft &&
      !github.event.release.prerelease &&
      needs.validate.outputs.prerelease == 'false'
    needs: [validate, build, github-release]
    runs-on: ubuntu-latest
    environment: wordpress.org
    concurrency:
      group: wordpress-org-beautiful-recent-posts-widget
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist/
      - name: Check deployment credentials
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          if [[ -z "$SVN_USERNAME" || -z "$SVN_PASSWORD" ]]; then
            echo '::error::Configure SVN_USERNAME and SVN_PASSWORD repository or wordpress.org environment secrets.'
            exit 1
          fi
      - name: Recheck the live release, tag and verified distribution
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          python3 scripts/release.py guard --sha "$RELEASE_SHA"
          python3 scripts/release.py verify
          sudo apt-get update -qq
          sudo apt-get install -y subversion
          python3 scripts/release.py preflight-svn
      - name: Deploy verified ZIP contents and branding
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # stable, verified 2026-09-27
        with:
          generate-zip: false
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: beautiful-recent-posts-widget
          VERSION: ${{ needs.validate.outputs.version }}
          BUILD_DIR: .release/beautiful-recent-posts-widget
          ASSETS_DIR: dist/wordpress-assets
      - name: Verify the published SVN tag matches the GitHub ZIP contents
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          svn export --non-interactive "https://plugins.svn.wordpress.org/beautiful-recent-posts-widget/tags/$VERSION" "$RUNNER_TEMP/published-plugin"
          python3 scripts/release.py verify-svn --bundle .release/beautiful-recent-posts-widget --destination "$RUNNER_TEMP/published-plugin"
          svn export --non-interactive https://plugins.svn.wordpress.org/beautiful-recent-posts-widget/assets "$RUNNER_TEMP/published-assets"
          python3 scripts/release.py verify-svn --bundle dist/wordpress-assets --destination "$RUNNER_TEMP/published-assets"
          echo "Published and verified WordPress.org SVN tag $VERSION and branding assets." >> "$GITHUB_STEP_SUMMARY"
